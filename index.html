<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100008">
<title>Alfaaz — Lyric Visual Experience</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090006;color:#fff;font-family:Arial,sans-serif}
body{overflow:hidden}.screen{position:relative;width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(ellipse at center,#31051d,#090006 70%)}
video{width:100%;height:100%;object-fit:contain;background:#050005}
.overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:24px;opacity:0;transition:opacity .25s;pointer-events:none;background:linear-gradient(transparent 65%,rgba(0,0,0,.55))}
.screen:hover .overlay,.screen.controls-visible .overlay{opacity:1}
.controls{width:min(900px,100%);display:flex;align-items:center;gap:12px;pointer-events:auto}
button{border:1px solid #a64a78;background:rgba(25,3,16,.85);color:#fff;border-radius:99px;padding:10px 15px;cursor:pointer}
button:hover{background:#7d164e}
input[type=range]{accent-color:#ff4da8;cursor:pointer}
#seek{flex:1;min-width:40px}#volume{width:85px}.time{font-size:12px;color:#f4c5dd;white-space:nowrap;font-variant-numeric:tabular-nums}
.top{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;text-shadow:0 2px 10px #000}
.brand{font-size:11px;letter-spacing:4px;color:#ffd0e7}.hint{font-size:10px;letter-spacing:1px;color:#e9b5cf}
@media(max-width:560px){.controls{gap:7px}.time{font-size:10px}button{padding:9px 11px}#volume{width:55px}.hint{display:none}}
</style>
</head>
<body>
<main class="screen" id="screen">
  <video id="video" playsinline preload="metadata">
    <source src="reference-video.mp4" type="video/mp4">
    Your browser does not support HTML video.
  </video>
  <div class="top"><div class="brand">ALFAAZ · LYRIC VISUAL EXPERIENCE</div><div class="hint">USE FULLSCREEN FOR THE BEST VIEW</div></div>
  <div class="overlay">
    <div class="controls">
      <button id="play" aria-label="Play or pause">▶</button>
      <span class="time" id="current">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
      <span class="time" id="duration">0:00</span>
      <input id="volume" type="range" min="0" max="1" step=".01" value="1" aria-label="Volume">
      <button id="mute">♫</button>
      <button id="full">⛶</button>
    </div>
  </div>
</main>
<script>
const v=document.getElementById('video'),screen=document.getElementById('screen');
const play=document.getElementById('play'),seek=document.getElementById('seek');
const cur=document.getElementById('current'),dur=document.getElementById('duration');
const volume=document.getElementById('volume'),mute=document.getElementById('mute');
const fmt=s=>{if(!Number.isFinite(s))return '0:00';let m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+String(sec).padStart(2,'0')};
play.onclick=()=>v.paused?v.play():v.pause();
v.onplay=()=>play.textContent='Ⅱ';v.onpause=()=>play.textContent='▶';
v.ontimeupdate=()=>{cur.textContent=fmt(v.currentTime);if(!seek.matches(':active')&&v.duration)seek.value=v.currentTime/v.duration*1000};
v.onloadedmetadata=()=>dur.textContent=fmt(v.duration);
seek.oninput=()=>{if(v.duration)v.currentTime=seek.value/1000*v.duration};
volume.oninput=()=>{v.volume=Number(volume.value);v.muted=v.volume===0;mute.textContent=v.muted?'×':'♫'};
mute.onclick=()=>{v.muted=!v.muted;mute.textContent=v.muted?'×':'♫'};
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)screen.requestFullscreen?.();else document.exitFullscreen?.()};
let hideTimer;function showControls(){screen.classList.add('controls-visible');clearTimeout(hideTimer);hideTimer=setTimeout(()=>screen.classList.remove('controls-visible'),2200)}
screen.addEventListener('mousemove',showControls);screen.addEventListener('touchstart',showControls,{passive:true});
v.addEventListener('click',()=>v.paused?v.play():v.pause());
</script>
</body>
</html>
