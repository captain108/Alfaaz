<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gulaab — animated lyrics</title>
<style>
/* ---- Customize here ---- */
:root{
  --neon:#ff2d78; --neon2:#ff6a3d; --crimson:#b3001b; --burgundy:#3a0614; --black:#07020a;
  --font:'Noto Sans Gurmukhi','Noto Sans Devanagari','Segoe UI',system-ui,sans-serif;
  --display:'Playfair Display','Noto Serif Gurmukhi',Georgia,serif;
  --speed:1; /* animation speed multiplier, also set by the Speed slider */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--black);color:#fff;font-family:var(--font);overflow:hidden}
#stage{position:fixed;inset:0 0 56px 0;overflow:hidden;background:var(--black)}
.bg{position:absolute;inset:-6%;background-size:cover;background-position:center;transition:background 1.4s,opacity 1.4s;animation:cam calc(24s/var(--speed)) ease-in-out infinite alternate}
@keyframes cam{to{transform:scale(1.08) translate(-1%,1%)}}
.scene-night .bg{background:radial-gradient(ellipse at 30% 70%,#5a0a2a,transparent 60%),radial-gradient(ellipse at 80% 20%,var(--burgundy),var(--black) 70%)}
.scene-rose .bg{background:radial-gradient(circle at 25% 60%,#7a0a35,transparent 55%),radial-gradient(circle at 70% 30%,#3a0614,var(--black) 75%)}
.scene-fire .bg{background:radial-gradient(circle at 50% 110%,#ff6a3d,var(--crimson) 35%,var(--black) 75%)}
.scene-dusk .bg{background:linear-gradient(180deg,#2a0a3a,#a8305a 60%,#ff9a6a)}
.scene-crimson .bg{background:radial-gradient(circle at 50% 50%,#d1002b,#4a0010 70%,var(--black))}
.rays{position:absolute;inset:0;background:conic-gradient(from 200deg at 50% -10%,transparent,rgba(255,80,120,.16) 8%,transparent 16%,rgba(255,120,80,.1) 26%,transparent 36%);mix-blend-mode:screen;animation:ray calc(14s/var(--speed)) ease-in-out infinite alternate}
@keyframes ray{from{opacity:.4;transform:rotate(-4deg)}to{opacity:1;transform:rotate(4deg)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#rose{position:absolute;left:8%;top:50%;height:min(62vh,70vw);transform:translateY(-50%);opacity:0;transition:opacity 1s;filter:drop-shadow(0 0 8px var(--neon)) drop-shadow(0 0 22px var(--neon));animation:pulse calc(3s/var(--speed)) ease-in-out infinite}
#rose path{stroke-dasharray:1;stroke-dashoffset:1}
.scene-rose #rose{opacity:1}
.scene-rose #rose path{animation:draw calc(1.6s/var(--speed)) ease forwards}
.scene-rose #rose path:nth-child(2){animation-delay:.5s}.scene-rose #rose path:nth-child(3){animation-delay:.9s}
.scene-rose #rose path:nth-child(4){animation-delay:1.3s}.scene-rose #rose path:nth-child(5){animation-delay:2s}.scene-rose #rose path:nth-child(6){animation-delay:2.3s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{50%{filter:drop-shadow(0 0 14px var(--neon)) drop-shadow(0 0 40px var(--neon))}}
#lyric{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:6vh 7vw;text-align:center;align-items:center}
.scene-rose #lyric{align-items:flex-start;text-align:left;padding-left:min(46vw,60%)}
.line{font-size:clamp(1.6rem,5.2vw,4.2rem);line-height:1.25;font-weight:600;text-shadow:0 0 18px rgba(255,45,120,.55);animation:lineOut .9s calc(var(--out,0s)) forwards}
@keyframes lineOut{to{opacity:0;filter:blur(10px);transform:scale(1.06)}}
.w{display:inline-block;margin:0 .14em;opacity:0;filter:blur(14px);transform:translateY(.4em) scale(.9);animation:wIn calc(.8s/var(--speed)) calc(var(--d)/var(--speed)) cubic-bezier(.2,.8,.2,1) forwards}
@keyframes wIn{to{opacity:1;filter:blur(0);transform:none}}
.w.hl{color:var(--neon);font-family:var(--display);font-style:italic;text-shadow:0 0 10px var(--neon),0 0 30px var(--neon);animation:wIn calc(.8s/var(--speed)) calc(var(--d)/var(--speed)) forwards,glow calc(2s/var(--speed)) ease-in-out infinite alternate}
@keyframes glow{to{text-shadow:0 0 18px var(--neon),0 0 54px var(--neon2)}}
.kin{position:relative;width:100%;height:1.4em}
.kin .w{position:absolute;left:0;right:0;margin:0;font-size:1.9em;font-weight:900;letter-spacing:.04em;text-transform:uppercase;animation:kin var(--t) var(--d) both}
@keyframes kin{0%{opacity:0;transform:scale(2.4);filter:blur(18px)}18%{opacity:1;transform:scale(1);filter:blur(0)}80%{opacity:1;transform:scale(1.06)}100%{opacity:0;transform:scale(1.3);filter:blur(10px)}}
.kin .w:nth-child(3n+1){-webkit-text-stroke:2px var(--neon);color:transparent}
.kin .w:nth-child(3n+2){background:linear-gradient(90deg,#4aa8ff,#a56bff,var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent}
.zoom{animation:zoomIn calc(5s/var(--speed)) ease-out both,lineOut .9s var(--out) forwards}
@keyframes zoomIn{from{transform:scale(.85)}to{transform:scale(1.08)}}
#hint{position:absolute;bottom:1rem;left:0;right:0;text-align:center;color:#ffb3c7;font-size:.9rem}
#bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;gap:.7rem;align-items:center;padding:0 .8rem;background:rgba(10,2,14,.92);border-top:1px solid #4a1030;font-size:.8rem;overflow-x:auto;white-space:nowrap}
#bar button,.file{background:#2a0a1e;color:#fff;border:1px solid var(--neon);border-radius:999px;padding:.4rem .9rem;cursor:pointer;font:inherit}
#bar button:hover,.file:hover{background:var(--neon)}
.file input{display:none}
#seek{flex:1;min-width:120px}
input[type=range]{accent-color:var(--neon)}
label{display:flex;align-items:center;gap:.3rem}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:700px){.scene-rose #rose{left:50%;top:22%;transform:translate(-50%,-50%);height:30vh}.scene-rose #lyric{align-items:center;text-align:center;padding:42vh 6vw 0}}
@media(prefers-reduced-motion:reduce){.bg,.rays,#rose{animation:none}.w,.kin .w{animation-duration:.01s!important;filter:none}}

</style>
</head>
<body>
<div id="stage" class="scene-night">
  <div class="bg" id="bg"></div>
  <div class="rays"></div>
  <canvas id="fx"></canvas>
  <svg id="rose" viewBox="0 0 200 300" aria-hidden="true">
    <g fill="none" stroke="var(--neon)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path pathLength="1" d="M100 70c-22-2-34 14-30 32s26 26 44 18 20-30 4-42-34-6-38 10 6 22 20 20 12-14 2-16"/>
      <path pathLength="1" d="M70 100c-24-8-40 6-36 28s24 36 46 34"/>
      <path pathLength="1" d="M130 98c26-8 42 8 36 30s-24 34-46 32"/>
      <path pathLength="1" d="M80 160c6 22 14 34 20 50v84"/>
      <path pathLength="1" d="M100 250c-22-4-38-18-40-34 22 0 38 12 40 34z"/>
      <path pathLength="1" d="M100 270c22-4 38-18 40-34-22 0-38 12-40 34z"/>
    </g>
  </svg>
  <div id="lyric" aria-live="polite"></div>
  <p id="hint" hidden>Could not load song.mp3. Keep song.mp3 beside this HTML file.</p>
</div>
<div id="bar">
  <button id="play" aria-label="Play">Play</button>
  <button id="replay" aria-label="Replay">Replay</button>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Timeline">
  <span id="time">0:00 / 0:00</span>
  <label>Vol <input id="vol" type="range" min="0" max="1" step=".01" value=".8"></label>
  <button id="fs" aria-label="Fullscreen">Full screen</button>
</div>
<audio id="audio" src="song.mp3" preload="auto"></audio>
<script type="application/json" id="lyrics-data">{"title":"Gulaab","scenes":{"night":"assets/images/","rose":"assets/images/","dusk":"assets/images/","crimson":"assets/images/","fire":"assets/images/"},"lines":[{"start":1.39,"end":6.9,"text":"Akhiyan de samnay tu baitha rawein der tak","anim":"words","scene":"night","highlight":["Akhiyan","tu"]},{"start":7.46,"end":13.04,"text":"Vekhaan tennu raat saari, charhdi saveer tak","anim":"words","scene":"dusk","highlight":["raat saari","saveer"]},{"start":13.42,"end":18.96,"text":"Baaghan vicho main te torrey tere layi gulaab ve","anim":"words","scene":"rose","highlight":["gulaab"]},{"start":19.38,"end":24.4,"text":"Main te bas kehnda rehnda, aap janab ve","anim":"words","scene":"rose","highlight":["janab"]},{"start":24.68,"end":27.36,"text":"Tu te taareyaan ton vi sohna ay","anim":"zoom","scene":"dusk","highlight":["sohna"]},{"start":27.66,"end":30.37,"text":"Tere varga koi na hona ay","anim":"kinetic","scene":"crimson","highlight":["koi na"]},{"start":30.62,"end":33.28,"text":"Tu te taareyaan ton vi sohna ay","anim":"zoom","scene":"dusk","highlight":["sohna"]},{"start":33.66,"end":36.44,"text":"Tere varga koi na hona ay","anim":"kinetic","scene":"crimson","highlight":["hona"]},{"start":36.56,"end":39.78,"text":"Jinna aunda si mainu pyar karna ji","anim":"words","scene":"fire","highlight":["pyar"]},{"start":40.0,"end":42.6,"text":"Main te tere naal kar leya ay","anim":"words","scene":"night","highlight":["tere naal"]},{"start":42.66,"end":45.45,"text":"Main te chum lawan, ohna rawaan nu","anim":"words","scene":"rose","highlight":["chum lawan"]},{"start":45.62,"end":48.3,"text":"Jithon ik vaari kaddi langheya tu","anim":"words","scene":"dusk","highlight":["langheya tu"]},{"start":48.62,"end":51.32,"text":"Gallan do hi ne, hor koi vi nai","anim":"kinetic","scene":"crimson","highlight":["do hi","koi vi nai"]},{"start":51.6,"end":53.24,"text":"Ya te tu hi ay, ya te koi nai","anim":"zoom","scene":"fire","highlight":["tu hi","koi nai"]}]}</script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage'), lyricEl = $('lyric'), audio = $('audio'), bg = $('bg');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lines = [], idx = -2, hasAudio = true, playing = false, clock = 0, last = 0, duration = 40, speed = 1;
const FALLBACK = [{start:0,end:6,text:"Lyrics could not be loaded.",anim:"words",scene:"rose",highlight:[]}];

/* ---------- lyrics loading ---------- */
function setLines(data){
  lines = (data.lines || data).slice().sort((a,b)=>a.start-b.start);
  duration = Math.max(...lines.map(l=>l.end)) + 2; idx = -2; $('hint').hidden = true; render(0,true);
}
try { setLines(JSON.parse($('lyrics-data').textContent)); } catch (err) { $('hint').hidden = false; setLines(FALLBACK); console.error('Embedded lyrics JSON is invalid:', err); }

/* ---------- audio ---------- */
audio.volume = .8;
$('vol').oninput = e => audio.volume = Number(e.target.value);
audio.addEventListener('loadedmetadata', () => { if (Number.isFinite(audio.duration)) duration = audio.duration; });
audio.addEventListener('error', () => { $('hint').hidden = false; $('hint').textContent = 'Could not load song.mp3. Keep song.mp3 beside this HTML file.'; });
const now = () => hasAudio ? audio.currentTime : clock;
function seekTo(t){ if(hasAudio) audio.currentTime = t; else clock = t; idx = -2; render(t,true); }
function setPlaying(p){ playing = p; $('play').textContent = p ? 'Pause' : 'Play';
  if(hasAudio) p ? audio.play().catch(()=>{}) : audio.pause(); last = performance.now(); }
$('play').onclick = () => setPlaying(!playing);
$('replay').onclick = () => { seekTo(0); setPlaying(true); };
$('seek').oninput = e => seekTo(e.target.value/1000*duration);
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
addEventListener('keydown', e => { if(e.code==='Space' && e.target.tagName!=='INPUT'){ e.preventDefault(); setPlaying(!playing); } });
const fmt = s => Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');

/* ---------- lyric engine ---------- */
function render(t, force){
  let i = lines.findIndex(l => t >= l.start && t < l.end);
  if(i === idx && !force) return; idx = i;
  [...lyricEl.children].forEach(c => { c.style.setProperty('--out','0s'); c.classList.add('old'); setTimeout(()=>c.remove(), 900); });
  if(i < 0) return;
  const L = lines[i], span = L.end - L.start, off = Math.max(0, t - L.start);
  stage.className = 'scene-' + (L.scene || 'night');
  bg.style.backgroundImage = L.image ? `url("${L.image}")` : '';
  const hl = new Set((L.highlight||[]).map(w=>w.toLowerCase().replace(/[,.!?]/g,'')));
  const words = L.text.split(/\s+/), el = document.createElement('div');
  el.className = 'line' + (L.anim==='zoom' ? ' zoom' : '');
  el.style.setProperty('--out', Math.max(0, span - .9 - off) + 's');
  const wrap = L.anim==='kinetic' ? Object.assign(document.createElement('div'),{className:'kin'}) : el;
  words.forEach((w,k) => {
    const s = document.createElement('span'); s.className = 'w'; s.textContent = w;
    if(hl.has(w.toLowerCase().replace(/[,.!?]/g,''))) s.classList.add('hl');
    const step = L.anim==='kinetic' ? (span-.5)/words.length : Math.min(.45, (span*.55)/words.length);
    s.style.setProperty('--d', (k*step - off) + 's'); s.style.setProperty('--t', step+'s');
    wrap.appendChild(s);
  });
  if(wrap!==el) el.appendChild(wrap);
  lyricEl.appendChild(el);
}

/* ---------- particles (petals + embers) ---------- */
const cv = $('fx'), cx = cv.getContext('2d'); let W,H,P=[];
function resize(){ const d=Math.min(devicePixelRatio||1,2); W=cv.width=innerWidth*d; H=cv.height=cv.clientHeight*d;
  P = Array.from({length: reduced ? 0 : Math.min(70, Math.floor(innerWidth/18))}, () => mk(true)); }
function mk(init){ const d=Math.min(devicePixelRatio||1,2); return {x:Math.random()*W, y:init?Math.random()*H:-20*d, r:(2+Math.random()*7)*d, vy:(.3+Math.random()*.9)*d, vx:(Math.random()-.5)*.5*d, a:Math.random()*6.28, va:(Math.random()-.5)*.03, o:.25+Math.random()*.55, petal:Math.random()<.5}; }
function drawFx(){ cx.clearRect(0,0,W,H);
  for(const p of P){ p.y += p.vy*speed; p.x += (p.vx + Math.sin(p.a)*.4)*speed; p.a += p.va; if(p.y>H+20) Object.assign(p, mk(false));
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.globalAlpha = p.o; cx.shadowBlur = 14; cx.shadowColor = '#ff2d78'; cx.fillStyle = p.petal ? '#ff4d8a' : '#ffb36a';
    cx.beginPath(); p.petal ? cx.ellipse(0,0,p.r*1.4,p.r*.8,0,0,6.28) : cx.arc(0,0,p.r*.4,0,6.28); cx.fill(); cx.restore(); } }
addEventListener('resize', resize); resize();

/* ---------- main loop ---------- */
function loop(ts){
  const dt = Math.min(.1, (ts-last)/1000); last = ts;
  if(playing && !hasAudio){ clock += dt*speed; if(clock >= duration){ clock = duration; setPlaying(false); } }
  const t = now(); render(t); drawFx();
  $('seek').value = duration ? t/duration*1000 : 0; $('time').textContent = fmt(t)+' / '+fmt(duration);
  requestAnimationFrame(loop);
}
audio.onended = () => setPlaying(false);
requestAnimationFrame(loop);

</script>
</body>
</html>
