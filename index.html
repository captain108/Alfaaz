<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16000b">
<title>For You ♥ — Gulaab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
  /* ================= GLOBAL ================= */
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --ink:#f7eaf0;
    --muted:#b48a9e;
    --rose:#ff5fb0;
    --rose-deep:#ff168f;
    --line:rgba(255,120,180,.15);
    --font-sans:'DM Sans', system-ui, sans-serif;
    --font-serif:'Playfair Display', Georgia, serif;
    --neon:#ff4d8c;
    --glow:#ff99bb;
  }
  html,body{ height:100%; }
  body{
    background: #0b0b12;
    color:var(--ink);
    font-family:var(--font-sans);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ================= OPENING PAGE (For You) ================= */
  .opening{
    position:fixed; inset:0; z-index:100;
    background: radial-gradient(ellipse at 50% 0%, #2b0617 0%, #16000b 55%, #0d0006 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:2rem 1.5rem;
    transition: opacity .8s ease, visibility .8s ease;
    overflow:hidden;
  }
  .opening.hidden{ opacity:0; visibility:hidden; pointer-events:none; }

  .opening .ambient{
    position:absolute; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,60,140,.14), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,40,120,.12), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(255,90,160,.08), transparent 60%);
    animation: breathe 9s ease-in-out infinite alternate;
  }
  @keyframes breathe{ from{opacity:.6; transform:scale(1);} to{opacity:1; transform:scale(1.05);} }

  .opening .content{
    position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:1.1rem;
    max-width:600px;
  }
  .opening .eyebrow{
    font-size:.68rem; letter-spacing:.4em; color:var(--rose);
    text-transform:uppercase; font-weight:600;
  }
  .opening h1{
    font-family:var(--font-serif); font-weight:600; line-height:1.05;
    font-size: clamp(2.6rem, 8vw, 5.4rem); letter-spacing:-.01em;
  }
  .opening h1 em{
    font-style:italic; font-weight:500;
    background:linear-gradient(120deg, #ffd1e8, #ff63c8 55%, #ff168f);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .opening p{
    color:var(--muted); font-size: clamp(.95rem, 2vw, 1.12rem);
    max-width:34ch; line-height:1.6;
  }
  .open-button{
    margin-top:1rem; cursor:pointer; font-family:var(--font-sans); font-weight:600;
    font-size: clamp(.95rem, 2vw, 1.05rem);
    padding: 1rem 2.3rem; border-radius:100px;
    border:1px solid rgba(255,120,180,.5);
    color:#fff;
    background: linear-gradient(135deg, rgba(255,60,140,.9), rgba(255,20,110,.95));
    box-shadow: 0 0 0 rgba(255,60,140,0), 0 14px 40px -10px rgba(255,40,120,.6);
    display:inline-flex; align-items:center; gap:.7em;
    transition: transform .25s ease, box-shadow .3s ease;
    position:relative; overflow:hidden;
  }
  .open-button::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.25) 50%, transparent 70%);
    transform:translateX(-120%); transition:transform .8s ease;
  }
  .open-button:hover{ transform:translateY(-3px); box-shadow: 0 0 0 rgba(255,60,140,.3), 0 20px 50px -10px rgba(255,40,120,.8); }
  .open-button:hover::after{ transform:translateX(120%); }
  .open-button span{ font-size:1.1em; transition: transform .25s; }
  .open-button:hover span{ transform: translate(3px,-3px); }
  .opening .hint{
    font-size:.62rem; letter-spacing:.28em; color:#7a4d61;
    text-transform:uppercase; margin-top:.6rem;
  }
  .opening .tiny-heart{
    color:var(--rose); font-size:.9em; animation: heartbeat 1.8s ease-in-out infinite;
  }
  @keyframes heartbeat{
    0%,100%{transform:scale(1);} 12%{transform:scale(1.25);} 24%{transform:scale(1);}
    36%{transform:scale(1.18);} 48%{transform:scale(1);}
  }
  .opening .topline{
    position:absolute; top:clamp(1.2rem,4vw,2.4rem);
    font-size:.68rem; letter-spacing:.32em; color:var(--muted);
    display:flex; align-items:center; gap:.7em; text-transform:uppercase;
  }

  /* ================= GULAAB PLAYER (original layout, buttons trimmed) ================= */
  .gulaab-wrap{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column;
    opacity:0; visibility:hidden; pointer-events:none;
    transition: opacity .8s ease .2s, visibility .8s;
    background:#0b0b12;
  }
  .gulaab-wrap.visible{ opacity:1; visibility:visible; pointer-events:auto; }

  /* Original #stage */
  #stage{
    position:relative; flex:1 1 auto; overflow:hidden;
    background: radial-gradient(circle at 30% 40%, #1a1a2e, #0a0a12);
    display:flex; align-items:center; justify-content:center;
    min-height:0;
  }
  .scene-night{ --neon:#ff4d8c; --glow:#ff99bb; }
  .bg{
    position:absolute; inset:0;
    background: radial-gradient(circle at 70% 30%, #2e1a2e, #0a0a12 80%);
    z-index:0;
  }
  .rays{
    position:absolute; inset:0;
    background: conic-gradient(from 0deg at 70% 30%, transparent 0deg, rgba(255,80,140,0.08) 20deg, transparent 40deg, transparent 360deg);
    animation: rotateRays 18s linear infinite;
    z-index:0; pointer-events:none;
  }
  @keyframes rotateRays{ to{ transform: rotate(360deg); } }
  #fx{
    position:absolute; inset:0; width:100%; height:100%;
    z-index:1; pointer-events:none;
  }
  #rose{
    position:relative; z-index:2;
    width: min(50vw, 50vh); height:auto;
    filter: drop-shadow(0 0 18px var(--neon)) drop-shadow(0 0 40px #ff2d6f88);
    animation: pulseRose 3s ease-in-out infinite alternate;
  }
  @keyframes pulseRose{
    0% { filter: drop-shadow(0 0 12px var(--neon)) drop-shadow(0 0 30px #ff2d6f66); }
    100% { filter: drop-shadow(0 0 24px var(--glow)) drop-shadow(0 0 60px #ff2d6fcc); }
  }
  #rose path{
    stroke-dasharray:1; stroke-dashoffset:1; transition: stroke-dashoffset .1s;
  }
  #rose path.drawn{ stroke-dashoffset:0; }
  #lyric{
    position:absolute; bottom:12%; left:0; width:100%;
    text-align:center; font-size: clamp(1.6rem, 6vw, 3.2rem);
    font-weight:700; letter-spacing:.02em; color:#fff;
    text-shadow: 0 0 20px var(--neon), 0 0 60px #ff2d6faa, 0 2px 4px #000;
    padding:0 1rem; z-index:3; min-height:3em;
    transition: opacity .3s, transform .3s; pointer-events:none; line-height:1.3;
  }
  #hint{
    position:absolute; top:1rem; left:50%; transform:translateX(-50%);
    background:#000000cc; padding:.5rem 1.2rem; border-radius:2rem;
    font-size:.9rem; border:1px solid #ff4d8c66;
    backdrop-filter: blur(6px); z-index:10; white-space:nowrap; color:#fff;
  }

  /* Original #bar — MP3, Lyrics, Speed removed */
  #bar{
    flex:0 0 auto; display:flex; flex-wrap:wrap; align-items:center;
    gap:0.6rem 1rem; padding:0.6rem 1rem;
    background:#0f0f1a; border-top:1px solid #2a2a3a;
    z-index:20; font-size:0.85rem;
  }
  #bar button{
    background:#1f1f2e; border:1px solid #3a3a50; color:#ddd;
    padding:0.4rem 1rem; border-radius:2rem; font-weight:600;
    cursor:pointer; transition: background .2s, border-color .2s;
    font-size:0.85rem; line-height:1.2; white-space:nowrap;
  }
  #bar button:hover{ background:#2e2e42; border-color:var(--neon); }
  #bar button:active{ background:#3e2e4e; }
  #bar input[type="range"]{
    accent-color:var(--neon); background:transparent; cursor:pointer;
    width:120px; max-width:20vw;
  }
  #seek{ flex:1 1 180px; min-width:100px; }
  #time{
    font-variant-numeric:tabular-nums; color:#aaa;
    min-width:5.5em; text-align:center;
  }
  #bar label{
    display:flex; align-items:center; gap:0.3rem;
    color:#bbb; white-space:nowrap;
  }

  @media (max-width:700px){
    #bar{ gap:0.4rem 0.6rem; padding:0.5rem 0.6rem; }
    #bar button{ padding:0.3rem 0.7rem; font-size:0.75rem; }
    #seek{ flex-basis:120px; }
    #bar input[type="range"]{ width:70px; }
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

<!-- ================= OPENING PAGE ================= -->
<div class="opening" id="opening">
  <div class="ambient"></div>
  <div class="topline">
    <span class="tiny-heart">♥</span> A LITTLE SOMETHING FOR YOU <span class="tiny-heart">♥</span>
  </div>
  <div class="content">
    <div class="eyebrow">MADE WITH LOVE</div>
    <h1>Some feelings<br><em>need no words.</em></h1>
    <p>A little moment, made just for you.</p>
    <button class="open-button" id="openBtn">Open your surprise <span>↗</span></button>
    <div class="hint">TURN YOUR SOUND ON FOR THE FULL EXPERIENCE</div>
  </div>
</div>

<!-- ================= GULAAB PLAYER ================= -->
<div class="gulaab-wrap" id="gulaabWrap">
  <div id="stage" class="scene-night">
    <div class="bg" id="bg"></div><div class="rays"></div>
    <canvas id="fx"></canvas>
    <svg id="rose" viewBox="0 0 200 300" aria-hidden="true">
      <g fill="none" stroke="var(--neon)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path pathLength="1" d="M100 70c-22-2-34 14-30 32s26 26 44 18 20-30 4-42-34-6-38 10 6 22 20 20 12-14 2-16"/>
        <path pathLength="1" d="M70 100c-24-8-40 6-36 28s24 36 46 34"/>
        <path pathLength="1" d="M130 98c26-8 42 8 36 30s-24 34-46 32"/>
        <path pathLength="1" d="M80 160c6 22 14 34 20 50v84"/>
        <path pathLength="1" d="M100 250c-22-4-38-18-40-34 22 0 38 12 40 34z"/>
        <path pathLength="1" d="M100 270c22-4 38-18 40-34-22 0-38 12-40 34z"/>
      </g>
    </svg>
    <div id="lyric" aria-live="polite"></div>
    <p id="hint" hidden>Opened from a file: pick <b>lyrics.json</b> to load your lyrics.</p>
  </div>
  <div id="bar">
    <button id="play" aria-label="Play">Play</button>
    <button id="replay" aria-label="Replay">Replay</button>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Timeline">
    <span id="time">0:00 / 0:00</span>
    <label>Vol <input id="vol" type="range" min="0" max="1" step=".01" value=".8"></label>
    <button id="fs" aria-label="Fullscreen">Full screen</button>
  </div>
  <!-- Fixed audio source: song.mp3 in same folder -->
  <audio id="audio" preload="auto">
    <source src="song.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
</div>

<script>
(function(){
  'use strict';

  /* ================= OPENING → GULAAB TRANSITION ================= */
  const opening = document.getElementById('opening');
  const gulaabWrap = document.getElementById('gulaabWrap');
  const openBtn = document.getElementById('openBtn');

  let gulaabStarted = false;

  openBtn.addEventListener('click', () => {
    opening.classList.add('hidden');
    gulaabWrap.classList.add('visible');
    startGulaab();
  });

  /* ================= GULAAB PLAYER LOGIC ================= */
  let lyrics = [];
  let currentLyricIndex = -1;
  let isPlaying = false;
  let rafId = null;
  let particles = [];
  let lastTime = 0;
  let particleSpawnTimer = 0;
  let roseDrawStart = 0;

  const stage = document.getElementById('stage');
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  const roseSvg = document.getElementById('rose');
  const rosePaths = roseSvg.querySelectorAll('path');
  const lyricEl = document.getElementById('lyric');
  const hintEl = document.getElementById('hint');

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('play');
  const replayBtn = document.getElementById('replay');
  const seekInput = document.getElementById('seek');
  const timeDisplay = document.getElementById('time');
  const volInput = document.getElementById('vol');
  const fsBtn = document.getElementById('fs');

  /* ---- Canvas ---- */
  function resizeCanvas(){
    const rect = stage.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);

  /* ---- Particles ---- */
  const MAX_PARTICLES = 140;

  function spawnParticle(){
    if (particles.length >= MAX_PARTICLES) return;
    const rect = stage.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const x = w * (0.2 + Math.random() * 0.6);
    const y = h * (0.3 + Math.random() * 0.5);
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.3 + Math.random() * 1.4;
    const size = 1.5 + Math.random() * 3.5;
    const life = 1.2 + Math.random() * 2.2;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 0.6,
      size, life, maxLife: life,
      hue: 330 + Math.random() * 40,
      lightness: 55 + Math.random() * 25,
    });
  }

  function updateParticles(dt){
    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      p.vy -= 0.004;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles(){
    for (const p of particles){
      const alpha = Math.max(0, p.life / p.maxLife) * 0.7;
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2.5);
      grad.addColorStop(0, `hsla(${p.hue}, 90%, ${p.lightness}%, ${alpha})`);
      grad.addColorStop(1, `hsla(${p.hue}, 90%, ${p.lightness}%, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function canvasLoop(timestamp){
    const dt = Math.min(0.05, (timestamp - (lastTime || timestamp)) / 1000);
    lastTime = timestamp;
    const rect = stage.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);

    if (isPlaying){
      particleSpawnTimer += dt;
      const spawnRate = 0.035;
      while (particleSpawnTimer > spawnRate){
        particleSpawnTimer -= spawnRate;
        spawnParticle();
      }
    } else {
      particleSpawnTimer += dt;
      if (particleSpawnTimer > 0.12){
        particleSpawnTimer -= 0.12;
        spawnParticle();
      }
    }

    updateParticles(dt);
    drawParticles();
    rafId = requestAnimationFrame(canvasLoop);
  }

  /* ---- Rose drawing ---- */
  function animateRose(timestamp){
    if (!roseDrawStart) roseDrawStart = timestamp;
    const elapsed = (timestamp - roseDrawStart) / 1000;
    const totalPaths = rosePaths.length;
    const drawDuration = 1.8;
    const stagger = 0.15;
    rosePaths.forEach((path, i) => {
      const start = i * stagger;
      const progress = Math.min(1, Math.max(0, (elapsed - start) / drawDuration));
      const easeOut = 1 - Math.pow(1 - progress, 2);
      if (easeOut >= 0.999){
        path.style.strokeDashoffset = '0';
        path.classList.add('drawn');
      } else {
        path.style.strokeDashoffset = (1 - easeOut).toFixed(4);
      }
    });
    if (elapsed < totalPaths * stagger + drawDuration + 0.5){
      requestAnimationFrame(animateRose);
    } else {
      rosePaths.forEach(p => { p.style.strokeDashoffset = '0'; });
    }
  }

  /* ---- Lyrics ---- */
  function formatTime(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  function updateTimeDisplay(){
    const cur = audio.currentTime || 0;
    const dur = audio.duration || 0;
    timeDisplay.textContent = `${formatTime(cur)} / ${formatTime(dur)}`;
    if (dur > 0) seekInput.value = Math.round((cur / dur) * 1000);
  }

  function findLyricIndex(time){
    if (!lyrics.length) return -1;
    let lo = 0, hi = lyrics.length - 1, result = -1;
    while (lo <= hi){
      const mid = (lo + hi) >> 1;
      if (lyrics[mid].time <= time + 0.05){
        result = mid; lo = mid + 1;
      } else hi = mid - 1;
    }
    return result;
  }

  function updateLyric(){
    if (!lyrics.length){ lyricEl.textContent = ''; return; }
    const idx = findLyricIndex(audio.currentTime);
    if (idx !== currentLyricIndex){
      currentLyricIndex = idx;
      if (idx >= 0 && idx < lyrics.length){
        lyricEl.style.opacity = '0';
        lyricEl.style.transform = 'translateY(12px)';
        void lyricEl.offsetHeight;
        lyricEl.textContent = lyrics[idx].text;
        lyricEl.style.opacity = '1';
        lyricEl.style.transform = 'translateY(0)';
      } else {
        lyricEl.textContent = '';
        lyricEl.style.opacity = '0';
      }
    }
  }

  function onTimeUpdate(){ updateTimeDisplay(); updateLyric(); }
  function onLoadedMetadata(){ updateTimeDisplay(); if (lyrics.length) updateLyric(); }

  /* ---- Play/Pause ---- */
  function togglePlay(){
    if (audio.paused){
      audio.play().then(() => {
        isPlaying = true;
        playBtn.textContent = 'Pause';
      }).catch(() => {});
    } else {
      audio.pause();
      isPlaying = false;
      playBtn.textContent = 'Play';
    }
  }

  playBtn.addEventListener('click', togglePlay);
  audio.addEventListener('play', () => { isPlaying = true; playBtn.textContent = 'Pause'; });
  audio.addEventListener('pause', () => { isPlaying = false; playBtn.textContent = 'Play'; });
  audio.addEventListener('ended', () => { isPlaying = false; playBtn.textContent = 'Play'; });
  audio.addEventListener('timeupdate', onTimeUpdate);
  audio.addEventListener('loadedmetadata', onLoadedMetadata);
  audio.addEventListener('seeked', () => { updateTimeDisplay(); updateLyric(); });

  /* ---- Replay ---- */
  replayBtn.addEventListener('click', () => {
    audio.currentTime = 0;
    if (audio.paused){
      audio.play().then(() => { isPlaying = true; playBtn.textContent = 'Pause'; }).catch(() => {});
    }
    updateLyric();
  });

  /* ---- Seek / Vol ---- */
  seekInput.addEventListener('input', () => {
    if (audio.duration) audio.currentTime = (seekInput.value / 1000) * audio.duration;
  });
  volInput.addEventListener('input', () => { audio.volume = parseFloat(volInput.value); });
  audio.volume = parseFloat(volInput.value);

  /* ---- Lyrics JSON loader ---- */
  function loadLyricsFromData(data){
    let arr = null;
    if (Array.isArray(data)) arr = data;
    else if (data && Array.isArray(data.lyrics)) arr = data.lyrics;
    if (!arr){ console.warn('Unrecognized lyrics format'); return; }
    lyrics = arr
      .filter(item => item && typeof item.time === 'number' && typeof item.text === 'string')
      .map(item => ({ time: item.time, text: item.text.trim() }))
      .sort((a, b) => a.time - b.time);
    currentLyricIndex = -1;
    hintEl.hidden = true;
    updateLyric();
  }

  /* ---- Auto-load lyrics.json from same folder ---- */
  // Use fetch first; fall back to XHR for file:// protocol
  fetch('lyrics.json')
    .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(data => loadLyricsFromData(data))
    .catch(() => {
      try {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', 'lyrics.json', true);
        xhr.onload = function(){
          if (xhr.status === 200 || xhr.status === 0){
            try { loadLyricsFromData(JSON.parse(xhr.responseText)); } catch(e){}
          } else if (location.protocol === 'file:'){
            hintEl.hidden = false;
            hintEl.innerHTML = 'Pick <b>lyrics.json</b> to load your lyrics.';
          }
        };
        xhr.onerror = function(){
          if (location.protocol === 'file:'){
            hintEl.hidden = false;
            hintEl.innerHTML = 'Pick <b>lyrics.json</b> to load your lyrics.';
          }
        };
        xhr.send();
      } catch(e){}
    });

  /* ---- Fullscreen ---- */
  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) stage.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  });

  /* ================= START GULAAB ================= */
  function startGulaab(){
    if (gulaabStarted) return;
    gulaabStarted = true;

    // Resize & start canvas
    resizeCanvas();
    if (!rafId) rafId = requestAnimationFrame(canvasLoop);

    // Trigger rose drawing
    roseDrawStart = 0;
    rosePaths.forEach(p => { p.style.strokeDashoffset = '1'; p.classList.remove('drawn'); });
    requestAnimationFrame(animateRose);

    // Start audio (user gesture)
    if (audio.paused){
      audio.currentTime = 0;
      audio.play().then(() => {
        isPlaying = true;
        playBtn.textContent = 'Pause';
      }).catch(() => {});
    }

    // Initial lyric
    if (lyrics.length) updateLyric();
  }

})();
</script>
</body>
</html>
