<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gulaab — animated lyrics</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Cinzel:wght@600;700;800;900&display=swap');
/* ---- Customize here ---- */
:root{
  --neon:#ff2d78; --neon2:#ff6a3d; --crimson:#b3001b; --burgundy:#3a0614; --black:#07020a;
  --font:'Cormorant Garamond','Noto Serif Gurmukhi',Georgia,serif;
  --display:'Cinzel','Cormorant Garamond',Georgia,serif;
  --speed:1;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--black);color:#fff;font-family:var(--font);overflow:hidden}
#stage{position:fixed;inset:0 0 56px 0;overflow:hidden;background:var(--black)}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;will-change:auto}
.scene-night .bg{background:radial-gradient(ellipse at 30% 70%,#5a0a2a,transparent 60%),radial-gradient(ellipse at 80% 20%,var(--burgundy),var(--black) 70%)}
.scene-rose .bg{background:radial-gradient(circle at 25% 60%,#7a0a35,transparent 55%),radial-gradient(circle at 70% 30%,#3a0614,var(--black) 75%)}
.scene-fire .bg{background:radial-gradient(circle at 50% 110%,#ff6a3d,var(--crimson) 35%,var(--black) 75%)}
.scene-dusk .bg{background:linear-gradient(180deg,#2a0a3a,#a8305a 60%,#ff9a6a)}
.scene-crimson .bg{background:radial-gradient(circle at 50% 50%,#d1002b,#4a0010 70%,var(--black))}
.rays{position:absolute;inset:0;background:conic-gradient(from 200deg at 50% -10%,transparent,rgba(255,80,120,.12) 8%,transparent 16%,rgba(255,120,80,.08) 26%,transparent 36%);pointer-events:none;animation:ray 14s ease-in-out infinite alternate}
@keyframes ray{from{opacity:.55}to{opacity:.9}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#rose{position:absolute;left:8%;top:50%;height:min(62vh,70vw);transform:translateY(-50%);opacity:0;transition:opacity .5s;filter:drop-shadow(0 0 7px var(--neon))}
#rose path{stroke-dasharray:1;stroke-dashoffset:1}
.scene-rose #rose{opacity:1}
.scene-rose #rose path{animation:draw calc(1.6s/var(--speed)) ease forwards}
.scene-rose #rose path:nth-child(2){animation-delay:.5s}.scene-rose #rose path:nth-child(3){animation-delay:.9s}
.scene-rose #rose path:nth-child(4){animation-delay:1.3s}.scene-rose #rose path:nth-child(5){animation-delay:2s}.scene-rose #rose path:nth-child(6){animation-delay:2.3s}
@keyframes draw{to{stroke-dashoffset:0}}
#lyric{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:6vh 7vw;text-align:center;align-items:center}
.scene-rose #lyric{align-items:flex-start;text-align:left;padding-left:min(46vw,60%)}
.line{font-family:var(--font);font-size:clamp(1.35rem,3.4vw,2.75rem);line-height:1.28;font-weight:600;letter-spacing:.015em;text-shadow:0 0 16px rgba(255,45,120,.58),0 0 30px rgba(255,45,120,.22);animation:lineOut .65s calc(var(--out,0s)) forwards;will-change:opacity,transform}
@keyframes lineOut{to{opacity:0;transform:scale(1.035)}}
.w{display:inline-block;margin:0 .14em;opacity:0;font-family:var(--font);font-weight:700;letter-spacing:.01em;transform:translateY(.28em) scale(.94);animation:wIn .65s calc(var(--d)) cubic-bezier(.2,.8,.2,1) forwards}
@keyframes wIn{to{opacity:1;transform:none}}
.w.hl{color:#ff6b9f;font-family:var(--display);font-style:italic;font-weight:700;letter-spacing:.025em;text-shadow:0 0 7px rgba(255,45,120,.95),0 0 16px rgba(255,45,120,.72),0 0 28px rgba(255,45,120,.35);animation:wIn .65s calc(var(--d)) cubic-bezier(.2,.8,.2,1) forwards}
.kin{position:relative;width:100%;min-height:1.4em;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.08em .22em}
.kin .w{position:relative;display:inline-block;margin:0;font-family:var(--display);font-size:1.05em;font-weight:800;letter-spacing:.035em;text-transform:uppercase;text-shadow:0 0 9px rgba(255,45,120,.85),0 0 22px rgba(255,45,120,.42);animation:kinReveal .32s var(--d) both}
@keyframes kinReveal{0%{opacity:0;transform:translateY(.22em) scale(1.18)}70%{opacity:1;transform:translateY(0) scale(1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}
.kin .w:nth-child(3n+1){-webkit-text-stroke:2px var(--neon);color:transparent;text-shadow:0 0 8px rgba(255,45,120,.9),0 0 20px rgba(255,45,120,.5)}
.kin .w:nth-child(3n+2){background:linear-gradient(90deg,#4aa8ff,#a56bff,var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 5px rgba(255,45,120,.55))}
.zoom{animation:zoomIn calc(5s/var(--speed)) ease-out both,lineOut .9s var(--out) forwards}
@keyframes zoomIn{from{transform:scale(.85)}to{transform:scale(1.08)}}

@media(max-width:600px){
  #lyric{padding:5vh 6vw}
  .scene-rose #lyric{padding-left:6vw}
  .line{font-size:clamp(1.15rem,6vw,2rem);line-height:1.3}
  .kin{gap:.06em .16em}
  .kin .w{font-size:.98em;letter-spacing:.02em}
}
\n#hint{position:absolute;bottom:1rem;left:0;right:0;text-align:center;color:#ffb3c7;font-size:.9rem}
#bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;gap:.7rem;align-items:center;padding:0 .8rem;background:rgba(10,2,14,.92);border-top:1px solid #4a1030;font-size:.8rem;overflow-x:auto;white-space:nowrap}
#bar button,.file{background:#2a0a1e;color:#fff;border:1px solid var(--neon);border-radius:999px;padding:.4rem .9rem;cursor:pointer;font:inherit}
#bar button:hover,.file:hover{background:var(--neon)}
.file input{display:none}
#seek{flex:1;min-width:120px}
input[type=range]{accent-color:var(--neon)}
label{display:flex;align-items:center;gap:.3rem}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:700px){.scene-rose #rose{left:50%;top:22%;transform:translate(-50%,-50%);height:30vh}.scene-rose #lyric{align-items:center;text-align:center;padding:42vh 6vw 0}}
@media(prefers-reduced-motion:reduce){.rays{animation:none}.w,.kin .w{animation-duration:.01s!important;filter:none}}


/* Smooth cinematic scene and lyric transitions */
.bg{animation:sceneBackgroundIn 1.15s cubic-bezier(.22,.7,.2,1) both}
@keyframes sceneBackgroundIn{
  0%{opacity:.45;transform:scale(1.045);filter:blur(7px)}
  100%{opacity:1;transform:scale(1);filter:blur(0)}
}
.line:not(.old){animation:lyricEnter .72s cubic-bezier(.2,.75,.25,1) both,lineOut .65s calc(var(--out,0s)) forwards}
@keyframes lyricEnter{
  0%{opacity:0;transform:translateY(16px) scale(.975);filter:blur(5px)}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
.kin .w{transition:color .35s ease,text-shadow .35s ease}
#rose{transition:opacity 1s ease,filter 1s ease}


/* Opening screen styles — original Gulaab styles below remain untouched */
#welcomeScreen{
  position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 38%,#4b102b 0%,#260817 44%,#10030b 100%);
  color:#fff;font-family:'DM Sans',Arial,sans-serif;
  opacity:1;visibility:visible;transform:scale(1);
  transition:opacity 1.05s ease,visibility 1.05s ease,transform 1.05s ease;
}
#welcomeScreen:before,#welcomeScreen:after{
  content:"";position:absolute;border:1px solid rgba(255,130,180,.13);border-radius:50%;
  width:min(82vw,720px);aspect-ratio:1;animation:welcomePulse 8s ease-in-out infinite;
}
#welcomeScreen:after{width:min(110vw,950px);animation-delay:-4s}
.welcome-glow{
  position:absolute;width:42vw;height:42vw;min-width:260px;min-height:260px;border-radius:50%;
  background:#e52b78;filter:blur(115px);opacity:.18;animation:welcomeGlow 7s ease-in-out infinite alternate;
}
.welcome-card{position:relative;z-index:1;width:min(92vw,760px);padding:30px 18px;text-align:center;animation:welcomeRise 1.2s cubic-bezier(.2,.75,.25,1) both}
.welcome-top{font-size:.68rem;letter-spacing:.25em;color:#f2b6ce;margin-bottom:clamp(45px,9vh,88px)}
.welcome-top span{color:#ff6da9;padding:0 10px}
.welcome-eyebrow{font-size:.68rem;letter-spacing:.35em;color:#ff9fc4;margin-bottom:20px}
.welcome-card h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(2.5rem,7vw,5.2rem);font-weight:500;line-height:1.08;letter-spacing:-.035em}
.welcome-card h1 em{color:#ff9bc2;font-weight:500}
.welcome-card p{font-size:clamp(.9rem,2vw,1.05rem);color:#e4c7d4;margin:22px 0 32px;letter-spacing:.04em}
#openSurprise{border:1px solid rgba(255,178,208,.65);border-radius:999px;padding:15px 27px;background:linear-gradient(110deg,#8d1749,#d52c75);box-shadow:0 0 28px rgba(255,45,120,.22),inset 0 1px rgba(255,255,255,.2);color:white;font:600 .9rem 'DM Sans',Arial,sans-serif;letter-spacing:.02em;cursor:pointer;transition:transform .25s,box-shadow .25s}
#openSurprise:hover{transform:translateY(-3px);box-shadow:0 0 38px rgba(255,45,120,.42)}
#openSurprise span{padding-left:14px;font-size:1.1rem}
.welcome-hint{font-size:.58rem;letter-spacing:.2em;color:#b88b9e;margin-top:28px}
.welcome-footer{position:absolute;left:0;right:0;bottom:-15vh;font-size:.58rem;letter-spacing:.22em;color:#b88b9e}
.welcome-footer span{color:#ff7cac;padding:0 9px}
body.welcome-open #welcomeScreen{opacity:0;visibility:hidden;transform:scale(1.025);pointer-events:none}
@keyframes welcomePulse{50%{transform:scale(1.08);opacity:.35}}
@keyframes welcomeGlow{to{transform:scale(1.25);opacity:.25}}
@keyframes welcomeRise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media(max-width:600px){.welcome-top{letter-spacing:.16em;margin-bottom:11vh}.welcome-card h1{font-size:clamp(2.4rem,11vw,4rem)}.welcome-hint{font-size:.5rem;letter-spacing:.12em}}
@media(prefers-reduced-motion:reduce){#welcomeScreen:before,#welcomeScreen:after,.welcome-glow,.welcome-card{animation:none}}


/* Smooth crossfade for scene backgrounds; original scene gradients remain unchanged */
.bg-crossfade{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background-size:cover;background-position:center;
  opacity:1;will-change:opacity;
  transition:opacity 1.65s cubic-bezier(.22,.61,.36,1);
}

</style>
</head>
<body>

<!-- Romantic opening screen: overlays the original Gulaab page without changing it -->
<section id="welcomeScreen" aria-label="Welcome">
  <div class="welcome-orbit"></div>
  <div class="welcome-orbit welcome-orbit-two"></div>
  <div class="welcome-glow"></div>
  <div class="welcome-card">
    <div class="welcome-top"><span>♥</span> A LITTLE SOMETHING FOR YOU <span>♥</span></div>
    <div class="welcome-eyebrow">MADE WITH LOVE</div>
    <h1>Some feelings<br><em>need no words.</em></h1>
    <p>A little moment, made just for you.</p>
    <button id="openSurprise" type="button">Open your surprise <span>↗</span></button>
    <div class="welcome-hint">TURN YOUR SOUND ON FOR THE FULL EXPERIENCE</div>
    <div class="welcome-footer">CRAFTED FROM THE HEART <span>✦</span> JUST FOR YOU</div>
  </div>
</section>

<div id="stage" class="scene-night">
  <div class="bg" id="bg"></div>
  <div class="rays"></div>
  <canvas id="fx"></canvas>
  <svg id="rose" viewBox="0 0 200 300" aria-hidden="true">
    <g fill="none" stroke="var(--neon)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path pathLength="1" d="M100 70c-22-2-34 14-30 32s26 26 44 18 20-30 4-42-34-6-38 10 6 22 20 20 12-14 2-16"/>
      <path pathLength="1" d="M70 100c-24-8-40 6-36 28s24 36 46 34"/>
      <path pathLength="1" d="M130 98c26-8 42 8 36 30s-24 34-46 32"/>
      <path pathLength="1" d="M80 160c6 22 14 34 20 50v84"/>
      <path pathLength="1" d="M100 250c-22-4-38-18-40-34 22 0 38 12 40 34z"/>
      <path pathLength="1" d="M100 270c22-4 38-18 40-34-22 0-38 12-40 34z"/>
    </g>
  </svg>
  <div id="lyric" aria-live="polite"></div>
  <p id="hint" hidden>Could not load song.mp3. Keep song.mp3 beside this HTML file.</p>
</div>
<div id="bar">
  <button id="play" aria-label="Play">Play</button>
  <button id="replay" aria-label="Replay">Replay</button>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Timeline">
  <span id="time">0:00 / 0:00</span>
  <label>Vol <input id="vol" type="range" min="0" max="1" step=".01" value=".8"></label>
  <button id="fs" aria-label="Fullscreen">Full screen</button>
</div>
<audio id="audio" src="song.mp3" preload="auto"></audio>
<script type="application/json" id="lyrics-data">{"title":"Gulaab","scenes":{"night":"assets/images/","rose":"assets/images/","dusk":"assets/images/","crimson":"assets/images/","fire":"assets/images/"},"lines":[{"start":1.39,"end":6.9,"text":"Akhiyan de samnay tu baitha rawein der tak","anim":"words","scene":"night","highlight":["Akhiyan","tu"]},{"start":7.46,"end":13.04,"text":"Vekhaan tennu raat saari, charhdi saveer tak","anim":"words","scene":"dusk","highlight":["raat saari","saveer"]},{"start":13.42,"end":18.96,"text":"Baaghan vicho main te torrey tere layi gulaab ve","anim":"words","scene":"rose","highlight":["gulaab"]},{"start":19.38,"end":24.4,"text":"Main te bas kehnda rehnda, aap janab ve","anim":"words","scene":"rose","highlight":["janab"]},{"start":24.68,"end":27.36,"text":"Tu te taareyaan ton vi sohna ay","anim":"zoom","scene":"dusk","highlight":["sohna"]},{"start":27.66,"end":30.37,"text":"Tere varga koi na hona ay","anim":"kinetic","scene":"crimson","highlight":["koi na"]},{"start":30.62,"end":33.28,"text":"Tu te taareyaan ton vi sohna ay","anim":"zoom","scene":"dusk","highlight":["sohna"]},{"start":33.66,"end":36.44,"text":"Tere varga koi na hona ay","anim":"kinetic","scene":"crimson","highlight":["hona"]},{"start":36.56,"end":39.78,"text":"Jinna aunda si mainu pyar karna ji","anim":"words","scene":"fire","highlight":["pyar"]},{"start":40.0,"end":42.6,"text":"Main te tere naal kar leya ay","anim":"words","scene":"night","highlight":["tere naal"]},{"start":42.66,"end":45.45,"text":"Main te chum lawan, ohna rawaan nu","anim":"words","scene":"rose","highlight":["chum lawan"]},{"start":45.62,"end":48.3,"text":"Jithon ik vaari kaddi langheya tu","anim":"words","scene":"dusk","highlight":["langheya tu"]},{"start":48.62,"end":51.32,"text":"Gallan do hi ne, hor koi vi nai","anim":"kinetic","scene":"crimson","highlight":["do hi","koi vi nai"]},{"start":51.6,"end":53.24,"text":"Ya te tu hi ay, ya te koi nai","anim":"zoom","scene":"fire","highlight":["tu hi","koi nai"]}]}</script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage'), lyricEl = $('lyric'), audio = $('audio'), bg = $('bg');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lines = [], idx = -2, hasAudio = true, playing = false, clock = 0, last = 0, duration = 40, speed = 1;
const FALLBACK = [{start:0,end:6,text:"Lyrics could not be loaded.",anim:"words",scene:"rose",highlight:[]}];

/* ---------- lyrics loading ---------- */
function setLines(data){
  lines = (data.lines || data).slice().sort((a,b)=>a.start-b.start);
  duration = Math.max(...lines.map(l=>l.end)) + 2; idx = -2; $('hint').hidden = true; render(0,true);
}
try { setLines(JSON.parse($('lyrics-data').textContent)); } catch (err) { $('hint').hidden = false; setLines(FALLBACK); console.error('Embedded lyrics JSON is invalid:', err); }

/* ---------- audio ---------- */
audio.volume = .8;
$('vol').oninput = e => audio.volume = Number(e.target.value);
audio.addEventListener('loadedmetadata', () => { if (Number.isFinite(audio.duration)) duration = audio.duration; });
audio.addEventListener('error', () => { $('hint').hidden = false; $('hint').textContent = 'Could not load song.mp3. Keep song.mp3 beside this HTML file.'; });
const now = () => hasAudio ? audio.currentTime : clock;
function seekTo(t){ if(hasAudio) audio.currentTime = t; else clock = t; idx = -2; render(t,true); }
function setPlaying(p){ playing = p; $('play').textContent = p ? 'Pause' : 'Play';
  if(hasAudio) p ? audio.play().catch(()=>{}) : audio.pause(); last = performance.now(); }
$('play').onclick = () => setPlaying(!playing);
$('replay').onclick = () => { seekTo(0); setPlaying(true); };
$('seek').oninput = e => seekTo(e.target.value/1000*duration);
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
addEventListener('keydown', e => { if(e.code==='Space' && e.target.tagName!=='INPUT'){ e.preventDefault(); setPlaying(!playing); } });
const fmt = s => Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');

/* ---------- lyric engine ---------- */
function render(t, force){
  let i = lines.findIndex(l => t >= l.start && t < l.end);
  if(i === idx && !force) return; idx = i;
  [...lyricEl.children].forEach(c => { c.style.setProperty('--out','0s'); c.classList.add('old'); setTimeout(()=>c.remove(), 900); });
  if(i < 0) return;
  const L = lines[i], span = L.end - L.start, off = Math.max(0, t - L.start);
  // Freeze the previous rendered background, then crossfade it over the new scene.
  const previousBg = document.createElement('div');
  const previousStyle = getComputedStyle(bg);
  previousBg.className = 'bg-crossfade';
  previousBg.style.backgroundImage = previousStyle.backgroundImage;
  previousBg.style.backgroundColor = previousStyle.backgroundColor;
  previousBg.style.backgroundPosition = previousStyle.backgroundPosition;
  previousBg.style.backgroundSize = previousStyle.backgroundSize;
  previousBg.style.backgroundRepeat = previousStyle.backgroundRepeat;
  stage.appendChild(previousBg);

  stage.className = 'scene-' + (L.scene || 'night');
  bg.style.backgroundImage = L.image ? `url("${L.image}")` : '';

  // Fade the frozen previous scene away after the new gradient has been applied.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    previousBg.style.opacity = '0';
  }));
  setTimeout(() => previousBg.remove(), 1800);
  const hl = new Set((L.highlight||[]).map(w=>w.toLowerCase().replace(/[,.!?]/g,'')));
  const words = L.text.split(/\s+/), el = document.createElement('div');
  el.className = 'line' + (L.anim==='zoom' ? ' zoom' : '');
  el.style.setProperty('--out', Math.max(0, span - .9 - off) + 's');
  const wrap = L.anim==='kinetic' ? Object.assign(document.createElement('div'),{className:'kin'}) : el;
  words.forEach((w,k) => {
    const s = document.createElement('span'); s.className = 'w'; s.textContent = w;
    if(hl.has(w.toLowerCase().replace(/[,.!?]/g,''))) s.classList.add('hl');
    const step = L.anim==='kinetic' ? (span-.5)/words.length : Math.min(.45, (span*.55)/words.length);
    s.style.setProperty('--d', (k*step - off) + 's'); s.style.setProperty('--t', step+'s');
    wrap.appendChild(s);
  });
  if(wrap!==el) el.appendChild(wrap);
  lyricEl.appendChild(el);
}

/* ---------- particles (petals + embers) ---------- */
const cv = $('fx'), cx = cv.getContext('2d'); let W,H,P=[];
function resize(){ const d=Math.min(devicePixelRatio||1,1.25); W=cv.width=Math.round(innerWidth*d); H=cv.height=Math.round(cv.clientHeight*d);
  P = Array.from({length: reduced ? 0 : Math.min(34, Math.floor(innerWidth/38))}, () => mk(true)); }
function mk(init){ const d=Math.min(devicePixelRatio||1,1.25); return {x:Math.random()*W, y:init?Math.random()*H:-20*d, r:(2+Math.random()*5)*d, vy:(.3+Math.random()*.8)*d, vx:(Math.random()-.5)*.35*d, a:Math.random()*6.28, va:(Math.random()-.5)*.02, o:.25+Math.random()*.5, petal:Math.random()<.5}; }
let lastFx = 0;
function drawFx(ts){ if(ts-lastFx<33) return; lastFx=ts; cx.clearRect(0,0,W,H);
  for(const p of P){ p.y += p.vy*speed*2; p.x += (p.vx + Math.sin(p.a)*.3)*speed*2; p.a += p.va*2; if(p.y>H+20) Object.assign(p, mk(false));
    cx.globalAlpha=p.o; cx.fillStyle=p.petal?'#ff4d8a':'#ffb36a'; cx.beginPath(); if(p.petal) cx.ellipse(p.x,p.y,p.r*1.3,p.r*.75,p.a,0,6.283); else cx.arc(p.x,p.y,p.r*.35,0,6.283); cx.fill();
  } cx.globalAlpha=1; }
addEventListener('resize', resize); resize();

/* ---------- main loop ---------- */
function loop(ts){
  const dt = Math.min(.1, (ts-last)/1000); last = ts;
  if(playing && !hasAudio){ clock += dt*speed; if(clock >= duration){ clock = duration; setPlaying(false); } }
  const t = now(); render(t); drawFx(ts);
  $('seek').value = duration ? t/duration*1000 : 0; $('time').textContent = fmt(t)+' / '+fmt(duration);
  requestAnimationFrame(loop);
}
audio.onended = () => setPlaying(false);
requestAnimationFrame(loop);


/* Opening-page handoff; original Gulaab playback and lyric engine remain unchanged */
document.getElementById('openSurprise').addEventListener('click', () => {
  document.body.classList.add('welcome-open');
  const originalPlayButton = document.getElementById('play');
  if (originalPlayButton) originalPlayButton.click();
});

</script>
</body>
</html>
