const FPS=15, DURATION=53.9;
const canvas=document.getElementById('visual'),ctx=canvas.getContext('2d');
const app=document.getElementById('app'),audio=document.getElementById('song');
const playBtn=document.getElementById('play'),seek=document.getElementById('seek');
const elapsed=document.getElementById('elapsed'),total=document.getElementById('total');
const status=document.getElementById('status'),loadedLabel=document.getElementById('loaded');
const cache=new Map();let currentFrame=0,loading=0,playing=false,lastDraw=-1,raf=0;
canvas.width=1200;canvas.height=730;
function timeFmt(t){let m=Math.floor(t/60),s=Math.floor(t%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
total.textContent=timeFmt(DURATION);
function loadFrame(i){
  if(i<0||i>=FRAMES.length||cache.has(i))return;
  loading++;
  const img=new Image();
  img.onload=()=>{cache.set(i,img);loading--;loadedLabel.textContent=cache.size+' / '+FRAMES.length;if(i===0){draw(0);status.textContent='Ready — press Play';}};
  img.onerror=()=>{loading--;status.textContent='Could not load '+FRAMES[i];};
  img.src=FRAMES[i];
}
function warmAround(i){
  for(let j=i;j<Math.min(FRAMES.length,i+75);j++)loadFrame(j);
  // Keep a rolling window in memory on lower-RAM computers.
  for(const k of cache.keys())if(k<i-15||k>i+100)cache.delete(k);
}
function draw(i){
  const img=cache.get(i);
  if(img){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);lastDraw=i;}
}
function tick(){
  if(!playing)return;
  const t=Math.min(audio.currentTime,DURATION);
  currentFrame=Math.min(FRAMES.length-1,Math.floor(t*FPS));
  warmAround(currentFrame);
  if(currentFrame!==lastDraw)draw(currentFrame);
  elapsed.textContent=timeFmt(t);
  seek.value=Math.round(t/DURATION*1000);
  if(t>=DURATION)pause();
  else raf=requestAnimationFrame(tick);
}
function start(){audio.play().then(()=>{playing=true;playBtn.textContent='Ⅱ Pause';status.textContent='Playing';cancelAnimationFrame(raf);tick();}).catch(()=>{status.textContent='Tap Play to start audio';})}
function pause(){playing=false;audio.pause();cancelAnimationFrame(raf);playBtn.textContent='▶ Play';}
playBtn.addEventListener('click',()=>playing?pause():start());
document.getElementById('restart').onclick=()=>{pause();audio.currentTime=0;currentFrame=0;warmAround(0);draw(0);elapsed.textContent='00:00';seek.value=0;};
seek.addEventListener('input',()=>{const t=Number(seek.value)/1000*DURATION;audio.currentTime=t;currentFrame=Math.min(FRAMES.length-1,Math.floor(t*FPS));warmAround(currentFrame);draw(currentFrame);elapsed.textContent=timeFmt(t);});
audio.addEventListener('ended',pause);
document.getElementById('mute').onclick=()=>{audio.muted=!audio.muted;document.getElementById('mute').textContent=audio.muted?'×':'♫';};
document.getElementById('volume').oninput=e=>audio.volume=Number(e.target.value);
document.getElementById('fullscreen').onclick=()=>!document.fullscreenElement?app.requestFullscreen?.():document.exitFullscreen?.();
for(let i=0;i<75;i++)loadFrame(i);
</script>
</body></html>
